name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a post-merge release while a newer PR run starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Verify Gramps rendering runtime
        run: |
          python - <<'PY'
          import cairo
          import gi
          from importlib.metadata import version

          print(f"gramps={version('gramps')}")
          print(f"pycairo={cairo.version}")
          print(f"pygobject={gi.__file__}")
          PY

      - name: Compile sources
        run: |
          python -m compileall -q \
            TwoWayFanChart \
            build_addon.py \
            ci \
            tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check committed diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --check "$BASE_SHA...$HEAD_SHA"
              ;;
            push)
              git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
              ;;
            *)
              git diff --check HEAD^ HEAD
              ;;
          esac

  distribution:
    name: distribution
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      tag: ${{ steps.release_metadata.outputs.tag }}
      archive_name: ${{ steps.release_metadata.outputs.archive_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Read release metadata
        id: release_metadata
        run: python ci/release_metadata.py --github-output "$GITHUB_OUTPUT"

      - name: Build distribution
        run: python build_addon.py

      - name: Validate distribution
        run: python ci/validate_distribution.py

      - name: Verify generated files are committed
        run: git diff --exit-code -- gramps60

      - name: Create archive checksum
        working-directory: gramps60/download
        run: sha256sum TwoWayFanChart.addon.tgz > TwoWayFanChart.addon.tgz.sha256

      - name: Upload add-on archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TwoWayFanChart-${{ github.sha }}
          path: |
            gramps60/download/TwoWayFanChart.addon.tgz
            gramps60/download/TwoWayFanChart.addon.tgz.sha256
          if-no-files-found: error

  release:
    name: release
    needs: distribution
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.distribution.outputs.version }}
      RELEASE_TAG: ${{ needs.distribution.outputs.tag }}
      RELEASE_ARCHIVE: ${{ needs.distribution.outputs.archive_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TwoWayFanChart-${{ github.sha }}
          path: release-artifacts

      - name: Verify archive checksum
        working-directory: release-artifacts
        run: sha256sum --check "${RELEASE_ARCHIVE}.sha256"

      - name: Create or verify GitHub release
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT

          verify_release() {
            python3 - "$release_json" "$RELEASE_ARCHIVE" "$(sha256sum "release-artifacts/$RELEASE_ARCHIVE" | cut -d ' ' -f 1)" <<'PY'
          import json
          import sys

          release_path, archive_name, archive_sha256 = sys.argv[1:]
          release = json.load(open(release_path, encoding="utf-8"))
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("release must be published and non-prerelease")

          expected_digest = f"sha256:{archive_sha256}"
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          archive = assets.get(archive_name)
          if archive is None:
              raise SystemExit(f"release is missing asset {archive_name}")
          if archive.get("digest") != expected_digest:
              raise SystemExit(
                  f"release asset digest mismatch: {archive.get('digest')!r} != {expected_digest!r}"
              )
          checksum_name = f"{archive_name}.sha256"
          if checksum_name not in assets:
              raise SystemExit(f"release is missing asset {checksum_name}")
          print(
              f"release_verified tag={release['tag_name']} "
              f"archive={archive_name} digest={expected_digest}"
          )
          PY
          }

          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::${RELEASE_TAG} already points to ${tag_commit}, expected ${GITHUB_SHA}"
              exit 1
            fi
            if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"; then
              echo "::error::${RELEASE_TAG} exists without a GitHub release"
              exit 1
            fi
            verify_release
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error::GitHub release ${RELEASE_TAG} exists but its tag is not available at the expected commit"
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "release-artifacts/$RELEASE_ARCHIVE" \
            "release-artifacts/${RELEASE_ARCHIVE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TwoWayFanChart ${RELEASE_VERSION}" \
            --generate-notes

          git fetch --tags origin
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::created ${RELEASE_TAG} points to ${tag_commit}, expected ${GITHUB_SHA}"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          verify_release

  deploy_grampsweb:
    name: deploy / GrampsWeb
    # No Portainer API or SSH call is made here. The only external write is a
    # commit to grostim/portainer-util; its existing push webhook deploys the
    # updated stack on Portainer.
    needs: [distribution, release]
    if: >-
      needs.release.result == 'success' &&
      vars.GRAMPSWEB_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: grampsweb-addon-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.PORTAINER_UTIL_TOKEN }}
      RELEASE_VERSION: ${{ needs.distribution.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout add-on automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: addon
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout GitHub stack repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: grostim/portainer-util
          ref: main
          token: ${{ secrets.PORTAINER_UTIL_TOKEN }}
          path: portainer-util
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and update rollout markers
        working-directory: portainer-util
        run: |
          python3 ../addon/ci/update_portainer_rollout.py \
            docker-compose.yml "$RELEASE_VERSION" "$RELEASE_SHA"

      - name: Verify the marker-only change
        working-directory: portainer-util
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [[ "$changed" != "docker-compose.yml" ]]; then
            echo "::error::unexpected changed files: $changed"
            exit 1
          fi
          git diff --check

      - name: Commit rollout marker to grostim/portainer-util
        working-directory: portainer-util
        run: |
          set -euo pipefail
          endpoint="repos/grostim/portainer-util/contents/docker-compose.yml"
          remote_blob_sha="$(gh api "$endpoint?ref=main" --jq '.sha')"
          local_blob_sha="$(git rev-parse HEAD:docker-compose.yml)"
          if [[ "$remote_blob_sha" != "$local_blob_sha" ]]; then
            echo "::error::portainer-util/main advanced; refusing a non-fast-forward update"
            exit 1
          fi

          content="$(base64 -w0 docker-compose.yml)"
          response="$(gh api "$endpoint" \
            --method PUT \
            --field "message=ci: roll out TwoWayFanChart ${RELEASE_VERSION}" \
            --field "content=${content}" \
            --field "sha=${remote_blob_sha}" \
            --field branch=main)"
          commit_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])' <<<"$response")"

          readback="$(gh api "$endpoint?ref=main" --jq '.content' | tr -d '\r\n')"
          printf '%s' "$readback" | base64 --decode > /tmp/portainer-compose-readback.yml
          cmp -- docker-compose.yml /tmp/portainer-compose-readback.yml
          echo "portainer_util_commit=$commit_sha"
          echo "rollout_marker=${RELEASE_VERSION}-release-${RELEASE_SHA:0:12}"
