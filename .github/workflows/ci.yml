name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - experimental
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Existing stable version to restore on Gramps Web (vX.Y.Z, manual rollback only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # PR runs share a ref-scoped group and may be cancelled. Release-producing
  # runs use the commit SHA so every push to main keeps its own pending run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Verify Gramps rendering runtime
        run: |
          python - <<'PY'
          import cairo
          import gi
          from importlib.metadata import version

          print(f"gramps={version('gramps')}")
          print(f"pycairo={cairo.version}")
          print(f"pygobject={gi.__file__}")
          PY

      - name: Compile sources
        run: |
          python -m compileall -q \
            TwoWayFanChart \
            build_addon.py \
            ci \
            tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check committed diff formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --check "$BASE_SHA...$HEAD_SHA"
              ;;
            push)
              git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
              ;;
            *)
              git diff --check HEAD^ HEAD
              ;;
          esac

  pr_version:
    name: pr version claim
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Step-level condition: on push to main the job must succeed (and
      # pass its gate to `distribution`); only pull requests check claims.
      - name: Reject release versions claimed by another open PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ci/check_pr_version.py \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.pull_request.base.ref }}" \
            --current-pr "${{ github.event.pull_request.number }}"

  distribution:
    name: distribution
    needs: [test, pr_version]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      tag: ${{ steps.release_metadata.outputs.tag }}
      archive_name: ${{ steps.release_metadata.outputs.archive_name }}
      channel: ${{ steps.release_channel.outputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Select release channel
        id: release_channel
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            branch="$GITHUB_BASE_REF"
          else
            branch="$GITHUB_REF_NAME"
          fi
          case "$branch" in
            experimental) channel=experimental ;;
            *) channel=stable ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "TWFC_CHANNEL=$channel"

      - name: Read release metadata
        id: release_metadata
        env:
          TWFC_CHANNEL: ${{ steps.release_channel.outputs.channel }}
        run: python ci/release_metadata.py --github-output "$GITHUB_OUTPUT"

      - name: Reject non-increasing release versions
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          from ci.release_metadata import read_release_metadata, validate_version_is_newer

          metadata = read_release_metadata(Path.cwd())
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines()
          existing_versions = [tag[1:] for tag in tags if tag.startswith("v")]
          validate_version_is_newer(metadata.version, existing_versions)
          print(
              f"release_version_order=ok version={metadata.version} "
              f"existing_tags={len(existing_versions)}"
          )
          PY

      - name: Build distribution
        env:
          TWFC_CHANNEL: ${{ steps.release_channel.outputs.channel }}
        run: python build_addon.py

      - name: Validate distribution
        env:
          TWFC_CHANNEL: ${{ steps.release_channel.outputs.channel }}
        run: python ci/validate_distribution.py

      - name: Verify generated files are committed
        if: steps.release_channel.outputs.channel == 'stable'
        run: git diff --exit-code -- gramps60

      - name: Create archive checksum
        working-directory: gramps60/download
        run: sha256sum TwoWayFanChart.addon.tgz > TwoWayFanChart.addon.tgz.sha256

      - name: Upload add-on archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TwoWayFanChart-${{ github.sha }}
          path: |
            gramps60/download/TwoWayFanChart.addon.tgz
            gramps60/download/TwoWayFanChart.addon.tgz.sha256
          if-no-files-found: error

  release:
    name: release
    needs: distribution
    if: >-
      ((github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental') &&
      inputs.rollback_version == ''))
    concurrency:
      group: twfc-release-tags
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.distribution.outputs.version }}
      RELEASE_TAG: ${{ needs.distribution.outputs.tag }}
      RELEASE_ARCHIVE: ${{ needs.distribution.outputs.archive_name }}
      RELEASE_CHANNEL: ${{ needs.distribution.outputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download tested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TwoWayFanChart-${{ github.sha }}
          path: release-artifacts

      - name: Verify archive checksum
        working-directory: release-artifacts
        run: sha256sum --check "${RELEASE_ARCHIVE}.sha256"

      - name: Create or verify GitHub release
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT

          verify_release() {
            python3 - \
              "$release_json" \
              "$RELEASE_TAG" \
              "$RELEASE_ARCHIVE" \
              "$(sha256sum "release-artifacts/$RELEASE_ARCHIVE" | cut -d ' ' -f 1)" \
              "$(sha256sum "release-artifacts/${RELEASE_ARCHIVE}.sha256" | cut -d ' ' -f 1)" \
              "$RELEASE_CHANNEL" <<'PY'
          import json
          import sys

          (
              release_path,
              expected_tag,
              archive_name,
              archive_sha256,
              checksum_asset_sha256,
              expected_channel,
          ) = sys.argv[1:]
          release = json.load(open(release_path, encoding="utf-8"))
          expected_prerelease = expected_channel == "experimental"
          if release.get("draft") or release.get("prerelease") != expected_prerelease:
              raise SystemExit(
                  f"release classification mismatch for channel {expected_channel!r}"
              )
          if release.get("tag_name") != expected_tag:
              raise SystemExit(
                  f"release tag mismatch: {release.get('tag_name')!r} != {expected_tag!r}"
              )

          expected_digest = f"sha256:{archive_sha256}"
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          archive = assets.get(archive_name)
          if archive is None:
              raise SystemExit(f"release is missing asset {archive_name}")
          if archive.get("digest") != expected_digest:
              raise SystemExit(
                  f"release asset digest mismatch: {archive.get('digest')!r} != {expected_digest!r}"
              )
          checksum_name = f"{archive_name}.sha256"
          checksum = assets.get(checksum_name)
          if checksum is None:
              raise SystemExit(f"release is missing asset {checksum_name}")
          expected_checksum_digest = f"sha256:{checksum_asset_sha256}"
          if checksum.get("digest") != expected_checksum_digest:
              raise SystemExit(
                  "release checksum asset digest mismatch: "
                  f"{checksum.get('digest')!r} != {expected_checksum_digest!r}"
              )
          print(
              f"release_verified tag={release['tag_name']} channel={expected_channel} "
              f"archive={archive_name} digest={expected_digest} "
              f"checksum_digest={expected_checksum_digest}"
          )
          PY
          }

          git fetch --tags origin
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from ci.release_metadata import read_release_metadata, validate_version_is_newer

          metadata = read_release_metadata(Path.cwd())
          tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
          versions = [tag[1:] for tag in tags if tag.startswith("v")]
          validate_version_is_newer(metadata.version, versions)
          print(f"release_version_order_rechecked=ok version={metadata.version} tags={len(versions)}")
          PY
          fi
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::${RELEASE_TAG} already points to ${tag_commit}, expected ${GITHUB_SHA}"
              exit 1
            fi
            if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"; then
              echo "::error::${RELEASE_TAG} exists without a GitHub release"
              exit 1
            fi
            verify_release
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error::GitHub release ${RELEASE_TAG} exists but its tag is not available at the expected commit"
            exit 1
          fi

          prerelease_args=()
          if [[ "$RELEASE_CHANNEL" == "experimental" ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "release-artifacts/$RELEASE_ARCHIVE" \
            "release-artifacts/${RELEASE_ARCHIVE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TwoWayFanChart ${RELEASE_VERSION} (${RELEASE_CHANNEL})" \
            --generate-notes \
            "${prerelease_args[@]}"

          git fetch --tags origin
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::created ${RELEASE_TAG} points to ${tag_commit}, expected ${GITHUB_SHA}"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          verify_release

  deploy_grampsweb:
    name: deploy / GrampsWeb
    # No Portainer API or SSH call is made here. The only external write is a
    # commit to grostim/portainer-util; its existing push webhook deploys the
    # updated stack.
    needs: [distribution, release]
    if: >-
      needs.release.result == 'success' &&
      vars.GRAMPSWEB_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental')) ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental') &&
      inputs.rollback_version == ''))
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: grampsweb-addon-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.PORTAINER_UTIL_TOKEN }}
      RELEASE_VERSION: ${{ needs.distribution.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_CHANNEL: ${{ needs.distribution.outputs.channel }}

    steps:
      - name: Checkout add-on automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: addon
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout GitHub stack repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grostim/portainer-util
          ref: main
          token: ${{ secrets.PORTAINER_UTIL_TOKEN }}
          path: portainer-util
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and update rollout markers
        working-directory: portainer-util
        run: |
          python3 ../addon/ci/update_portainer_rollout.py \
            docker-compose.yml "$RELEASE_VERSION" "$RELEASE_SHA" \
            --channel "$RELEASE_CHANNEL"

      - name: Verify the marker-only change
        working-directory: portainer-util
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [[ -n "$changed" && "$changed" != "docker-compose.yml" ]]; then
            echo "::error::unexpected changed files: $changed"
            exit 1
          fi
          if [[ -z "$changed" ]]; then
            echo "rollout markers are already present in the checked-out GitHub repository"
          fi
          git diff --check

      - name: Commit rollout marker to grostim/portainer-util
        working-directory: portainer-util
        run: |
          set -euo pipefail
          endpoint="repos/grostim/portainer-util/contents/docker-compose.yml"
          changed="$(git diff --name-only)"

          if [[ -z "$changed" ]]; then
            readback="$(gh api "$endpoint?ref=main" --jq '.content' | tr -d '\r\n')"
            printf '%s' "$readback" | base64 --decode > /tmp/portainer-compose-readback.yml
            cmp -- docker-compose.yml /tmp/portainer-compose-readback.yml
            echo "portainer_util_commit=already-present"
            echo "rollout_marker=${RELEASE_VERSION}-${RELEASE_CHANNEL}-release-${RELEASE_SHA:0:12}"
            exit 0
          fi

          remote_blob_sha="$(gh api "$endpoint?ref=main" --jq '.sha')"
          local_blob_sha="$(git rev-parse HEAD:docker-compose.yml)"
          if [[ "$remote_blob_sha" != "$local_blob_sha" ]]; then
            echo "::error::portainer-util/main advanced; refusing a non-fast-forward update"
            exit 1
          fi

          content="$(base64 -w0 docker-compose.yml)"
          response="$(gh api "$endpoint" \
            --method PUT \
            --field "message=ci: roll out TwoWayFanChart ${RELEASE_VERSION}" \
            --field "content=${content}" \
            --field "sha=${remote_blob_sha}" \
            --field branch=main)"
          commit_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])' <<<"$response")"

          readback="$(gh api "$endpoint?ref=main" --jq '.content' | tr -d '\r\n')"
          printf '%s' "$readback" | base64 --decode > /tmp/portainer-compose-readback.yml
          cmp -- docker-compose.yml /tmp/portainer-compose-readback.yml
          echo "portainer_util_commit=$commit_sha"
          echo "rollout_marker=${RELEASE_VERSION}-${RELEASE_CHANNEL}-release-${RELEASE_SHA:0:12}"

  rollback_grampsweb:
    name: rollback / GrampsWeb to stable release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.rollback_version != '' &&
      vars.GRAMPSWEB_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: grampsweb-addon-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.PORTAINER_UTIL_TOKEN }}
      ROLLBACK_VERSION: ${{ inputs.rollback_version }}
    steps:
      - name: Validate selected stable release
        run: |
          set -euo pipefail
          if [[ ! "$ROLLBACK_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rollback_version must be an exact stable tag such as v1.2.96"
            exit 1
          fi
          gh release view "$ROLLBACK_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,assets --jq \
            'if .isDraft or .isPrerelease then error("rollback target is not a published stable release") else . end | if ([.assets[].name] | index("TwoWayFanChart.addon.tgz") and index("TwoWayFanChart.addon.tgz.sha256")) then .tagName else error("stable rollback asset/checksum missing") end'

      - name: Checkout release source and Portainer stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: addon
          persist-credentials: false

      - name: Resolve immutable release commit
        working-directory: addon
        run: |
          set -euo pipefail
          git fetch --tags origin
          tag_commit="$(git rev-parse "${ROLLBACK_VERSION}^{commit}")"
          if [[ ! "$tag_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rollback tag did not resolve to an immutable commit"
            exit 1
          fi
          echo "ROLLBACK_SHA=$tag_commit" >> "$GITHUB_ENV"

      - name: Checkout Portainer stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grostim/portainer-util
          ref: main
          token: ${{ secrets.PORTAINER_UTIL_TOKEN }}
          path: portainer-util
          fetch-depth: 0
          persist-credentials: false

      - name: Set explicit stable rollback marker
        working-directory: portainer-util
        run: |
          version="${ROLLBACK_VERSION#v}"
          python3 ../addon/ci/update_portainer_rollout.py \
            docker-compose.yml "$version" "$ROLLBACK_SHA" \
            --channel stable --allow-rollback
          git diff --check
          changed="$(git diff --name-only)"
          if [[ "$changed" != docker-compose.yml ]]; then
            echo "::error::rollback must change only docker-compose.yml"
            exit 1
          fi
          git diff -- docker-compose.yml

      - name: Commit rollback markers to grostim/portainer-util
        working-directory: portainer-util
        run: |
          set -euo pipefail
          endpoint="repos/grostim/portainer-util/contents/docker-compose.yml"
          remote_blob_sha="$(gh api "$endpoint?ref=main" --jq '.sha')"
          local_blob_sha="$(git rev-parse HEAD:docker-compose.yml)"
          if [[ "$remote_blob_sha" != "$local_blob_sha" ]]; then
            echo "::error::portainer-util/main advanced; refusing a non-fast-forward rollback update"
            exit 1
          fi
          content="$(base64 -w0 docker-compose.yml)"
          response="$(gh api "$endpoint" --method PUT \
            --field "message=ci: rollback TwoWayFanChart to ${ROLLBACK_VERSION}" \
            --field "content=${content}" --field "sha=${remote_blob_sha}" --field branch=main)"
          commit_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])' <<<"$response")"
          echo "portainer_util_rollback_commit=$commit_sha"
          echo "rollback_release=$ROLLBACK_VERSION"
          echo "rollback_addon_sha=$ROLLBACK_SHA"
          readback="$(gh api "$endpoint?ref=main" --jq '.content' | tr -d '\r\n')"
          printf '%s' "$readback" | base64 --decode > /tmp/portainer-compose-rollback-readback.yml
          cmp -- docker-compose.yml /tmp/portainer-compose-rollback-readback.yml
